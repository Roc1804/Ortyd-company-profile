<!doctype html>
<html lang="en">
  <head>
    <style>

       body
      {
      background-color: gainsboro;
      }
 
      .badan
      {
      background-color: white;
      padding: 13px 0;
      margin-top: 30px;
      }
 
      .peding-100
      {
      padding: 120px;
      }
 
      .peding-30 
      {
      padding: 30px;
      }
      .btn {
      width: 100%; 
      padding: 12px 30px; 
      font-size: 16px; 
      font-weight: 600; 
      border: none; 
      border-radius: 30px; 
      cursor: pointer; 
      transition: all 0.3s ease; 
      text-transform: uppercase; 
      background: linear-gradient(45deg, #007bff, #0056b3); 
      color: white; 
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
      }
      .btn:hover {
      background: linear-gradient(45deg, #0056b3, #007bff); 
      transform: translateY(-3px); 
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3); 
      }
    .btn:active {
    background: linear-gradient(45deg, #004085, #0069d9); 
    transform: translateY(1px); 
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); 
    }
    .btn:focus {
    outline: none; 
    box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.5); 
    }
    .container {
  text-align: center; 
}
    </style>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
 
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Contact Form</title>
    <link rel="stylesheet" href="css/tampilan.css">
  </head>
  <body>
    <div class="container">
      <h1>Contact Us</h1>
    </div>
   <div class="container badan">
      <div class="row">
        <div class="col peding-100">
          <div class="hidden-sm-down">
            <a class="home-icon" href="index.html" title="Kembali ke Beranda">
              <img src="./assets/images/logos/logo-dark.png" alt="Home Icon" />
            </a>
          </div>
          <h1>Kontak Kami</h1>
          <p>
            Silahkan tinggalkan pesan anda, pada kolom yang tersedia.
          </p>
        </div>
 
        <div class="col peding-30">
          <form action="mailto:rizkysas12@gmail.com" method="POST" enctype="text/plain">
           
            <div class="form-group">
              <input type="text" class="form-control" name="nama" placeholder="Name:">
            </div>
 
            <div class="form-group">
              <input type="email" class="form-control" name="email" placeholder="Email:">
            </div>

            <div class="form-group">
              <input type="text" class="form-control" name="subjek" placeholder="Subject:">
            </div>

            <div class="form-group">
              <textarea name="pesan" placeholder="Message:" class="form-control" cols="30" rows="7"></textarea>
            </div>
            
            <div class="button-container">
                <input class="btn btn-primary" type="button" value="POST">
            </div>
 
          </form>
        </div>
      </div>
    </div>
   
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
  </body>
</html>
